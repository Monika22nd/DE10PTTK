name: Build, test and screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and package WAR
        run: bash gradlew clean test war
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run app and take screenshots
        run: |
          bash gradlew runLocal > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/ > /dev/null && break; sleep 2; done
          npm install --no-save puppeteer-core@22
          node tools/screenshots.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            app.log
      - name: Publish screenshots to branch ui-screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          cd screenshots
          git init -q -b ui-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "UI screenshots for ${GITHUB_SHA} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ui-screenshots
